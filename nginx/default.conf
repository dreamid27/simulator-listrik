# nginx untuk build statis Simulasi Listrik Rumah (build/client).
# Setara dengan perilaku Cloudflare Pages + public/_headers, untuk self-host.
# TLS diasumsikan diterminasi di depan (Cloudflare, load balancer, dsb.).

map $sent_http_content_type $cache_control {
    default                     "public, max-age=86400";
    ~*text/html                 "public, max-age=0, must-revalidate";
    ~*text/plain                "public, max-age=3600";
    ~*application/xml           "public, max-age=3600";
    ~*text/xml                  "public, max-age=3600";
}

server {
    listen 80;
    listen [::]:80;
    server_name faris.selo.my.id;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/javascript
               application/json application/manifest+json image/svg+xml;

    # Header keamanan (CSP ada di <meta> tiap halaman, lihat scripts/postbuild.ts)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $cache_control always;

    # Aset ber-hash dari Vite: cache selamanya.
    location /assets/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location ~ ^/llms(-full)?\.txt$ {
        default_type "text/plain; charset=utf-8";
        try_files $uri =404;
    }

    # URL kanonis: tanpa .html, tanpa garis miring penutup, tanpa /index.html.
    location = /index.html { return 301 /; }
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }
    rewrite ^/(.+)/$ /$1 permanent;

    # /simulator → simulator.html; halaman lain yang tidak ada → 404.html,
    # yang kemudian dirender router di browser sebagai "tidak ditemukan".
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Berkas konfigurasi Cloudflare Pages tidak perlu dilayani.
    location ~ ^/_(headers|redirects|routes\.json)$ {
        return 404;
    }

    # Jangan layani berkas tersembunyi.
    location ~ /\. {
        deny all;
        return 404;
    }
}
